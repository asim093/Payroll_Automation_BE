
services:
  - type: web
    name: payroll-automation-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TEST_MAILBOX_EMAIL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_CLIENT_ID
        sync: false
      - key: DELEGATED_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_MAILBOX_EMAIL
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false
      # PHASE-UI-13 — web-hosted mailbox login flow (see routes/oauthRoutes.js).
      # Only needed on THIS service (it's the one serving the HTTP routes) -
      # the cron services never need these, they just read the resulting
      # token back out of MongoDB via delegatedAuthService.js.
      - key: MICROSOFT_OAUTH_CALLBACK_URL
        sync: false
      - key: OAUTH_SETUP_SECRET
        sync: false
      - key: SHAREFILE_OAUTH_CALLBACK_URL
        sync: false
      # PHASE-UI-15 — web-hosted Dropbox login flow, same reasoning as
      # MICROSOFT_OAUTH_CALLBACK_URL above (only needed on this service).
      - key: DROPBOX_OAUTH_CALLBACK_URL
        sync: false
     

  - type: cron
    name: payroll-automation-mail-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node runMailSyncOnce.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TEST_MAILBOX_EMAIL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_CLIENT_ID
        sync: false
      - key: DELEGATED_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_MAILBOX_EMAIL
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false
      

  - type: cron
    name: payroll-automation-sharefile-bridge
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node runShareFileBridgeOnce.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false

  # Standalone cron for LogiForms ingestion - deliberately its own service,
  # not piggybacked onto sharefile-bridge above. A real ingestion run takes
  # ~10 minutes; Render crons don't overlap, so sharing a cron's script would
  # stall that cron's own schedule for the whole run every time a new
  # LogiForms file is detected. Render's cron timeout is a fixed 12-hour
  # default (no dashboard option to configure it - confirmed via the
  # sharefile-bridge cron's own Deploy settings), well above the real
  # ~10-minute run time, so this is safe. Scheduled every 15 min; the real
  # ~60-min interval is enforced inside runScheduledLogiFormsCheck via
  # isProcessDue, so most ticks just no-op after a cheap DB read.
  - type: cron
    name: payroll-automation-logiforms-ingest
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node runLogiFormsIngestOnly.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
