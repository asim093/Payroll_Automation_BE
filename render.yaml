
services:
  - type: web
    name: payroll-automation-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TEST_MAILBOX_EMAIL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_CLIENT_ID
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DELEGATED_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_MAILBOX_EMAIL
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false
      # PHASE-UI-13 — web-hosted mailbox login flow (see routes/oauthRoutes.js).
      # Only needed on THIS service (it's the one serving the HTTP routes) -
      # the cron services never need these, they just read the resulting
      # token back out of MongoDB via delegatedAuthService.js.
      - key: MICROSOFT_OAUTH_CALLBACK_URL
        sync: false
      - key: OAUTH_SETUP_SECRET
        sync: false

  # PHASE-UI-8 (+ UI-9) — split from the old single "payroll-automation-scan"
  # cron job into two independent services, one per process, so a slow/hung
  # ShareFile scan can never delay/block Mail Sync (or vice versa). Both
  # fire every 5 minutes; the Settings page's mailSyncIntervalMinutes/
  # shareFileBridgeIntervalMinutes (see services/scanThrottle.js) can still
  # raise the EFFECTIVE interval above 5 minutes with no redeploy, but 5
  # minutes is the floor now.
  #
  # UI-9 note: this was originally "* * * * *" (every minute, self-throttled
  # down to whatever Settings said) so the interval could reach all the way
  # to a true 1-minute floor with no redeploy. Reverted after live use on
  # Render showed two real problems with that: (1) unreliable env-var
  # injection into cron containers spun up that frequently - SCHEDULED runs
  # intermittently got MONGODB_URI as undefined while manual "Trigger Run"
  # never did, and (2) ~10x more container starts/day than the original
  # single 5-minute cron, which very plausibly costs more (Render bills
  # cron jobs by compute time, and every invocation - even a fast
  # not-due-yet skip - has its own cold-start overhead). 5 minutes matches
  # the cadence this app has run reliably on since its very first cron
  # design, so that's the floor now.
  - type: cron
    name: payroll-automation-mail-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node runMailSyncOnce.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TEST_MAILBOX_EMAIL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_CLIENT_ID
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DELEGATED_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_MAILBOX_EMAIL
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false

  - type: cron
    name: payroll-automation-sharefile-bridge
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node runShareFileBridgeOnce.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TEST_MAILBOX_EMAIL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_CLIENT_ID
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DELEGATED_REFRESH_TOKEN
        sync: false
      - key: DELEGATED_MAILBOX_EMAIL
        sync: false
      - key: SHAREFILE_CLIENT_ID
        sync: false
      - key: SHAREFILE_CLIENT_SECRET
        sync: false
      - key: SHAREFILE_SUBDOMAIN
        sync: false
      - key: SHAREFILE_USERNAME
        sync: false
      - key: SHAREFILE_PASSWORD
        sync: false
      - key: WEB_SERVICE_INTERNAL_URL
        fromService:
          name: payroll-automation-backend
          type: web
          property: hostport
      - key: INTERNAL_NOTIFY_SECRET
        sync: false
